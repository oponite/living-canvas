[package]
name = "living-canvas-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
lana-bytecode = { git = "https://github.com/oponite/lana.git", rev = "4e1606a390f44778029ff45bf0b8af7ff9b41272" }
lana-vm = { git = "https://github.com/oponite/lana.git", rev = "4e1606a390f44778029ff45bf0b8af7ff9b41272", default-features = false }
lana-runtime = { git = "https://github.com/oponite/lana.git", rev = "4e1606a390f44778029ff45bf0b8af7ff9b41272", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "=0.2.100"

[profile.release]
lto = true
codegen-units = 1
